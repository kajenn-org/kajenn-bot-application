name: Tests
"on":
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: read
jobs:
  test:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        server: [latest]
        include:
          - python: '3.11'
            server: minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the wheel and unlocked test dependencies
        run: python -m pip install "$(find dist -name '*.whl')[dev,docs]"
      - if: matrix.server == 'minimum'
        run: python -m pip install kajenn==0.3.0
      - run: python -m pip check
      - run: ruff check src tests examples tools
      - run: python tools/check_boundary.py
      - run: python -m pytest -q --cov-report=xml:coverage.xml
      - name: Upload coverage to Codecov
        if: matrix.python == '3.11' && matrix.server == 'latest'
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          use_oidc: true
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
      - if: matrix.python == '3.11' && matrix.server == 'latest'
        run: sphinx-build -W -b html docs docs/_build/html
      - if: matrix.python == '3.11' && matrix.server == 'latest'
        uses: actions/upload-artifact@v4
        with:
          name: distributions-and-docs
          path: |
            dist/
            docs/_build/html/
