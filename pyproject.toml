[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kajenn-bot-application"
version = "0.2.0b1"
description = "Telegram and WhatsApp bot applications for kajenn"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Genropy Team", email = "info@softwell.it"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
]
dependencies = [
    "kajenn>=0.4.1",
    "genro-bag>=0.27.0",
    "genro-builders>=0.27.0",
    "genro-routes>=0.30.1",
    "httpx>=0.27",
    "Telethon>=1.45,<2",
    "cryptography>=42.0",
    "filelock>=3.16",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "genro-toolbox>=0.17.0",
    "genro-storage[encryption]>=0.8.1",
    "genro-tytx>=0.16.2",
    "cryptography>=42.0",
]
dev = ["kajenn-bot-application[test]", "ruff>=0.1.0", "mypy>=1.0", "build>=1.0"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0", "myst-parser>=2.0"]

[project.urls]
Repository = "https://github.com/kajenn-org/kajenn-bot-application"
"Bug Tracker" = "https://github.com/kajenn-org/kajenn-bot-application/issues"
Documentation = "https://kajenn-bot-application.readthedocs.io/en/latest/"

[tool.hatch.build.targets.wheel]
packages = ["src/kajenn_bot_application"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/tools", "/hooks", "/README.md", "/CLAUDE.md", "/LICENSE", "/NOTICE", "/pyproject.toml", "/.readthedocs.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=kajenn_bot_application --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
follow_imports = "silent"
ignore_missing_imports = true

# Wheel-based tests execute site-packages code. Map those paths to the repository
# so coverage uploads link to the same source files as editable local runs.
[tool.coverage.paths]
source = ["src/kajenn_bot_application", "*/site-packages/kajenn_bot_application"]
